<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
<style>text{font-family:"Malgun Gothic",sans-serif;fill:#000}</style>
<rect width="900" height="420" fill="#fff"/>
<text x="20" y="26" font-size="13.5" font-weight="700">1단계 · 색을 고르는 법</text>
<line x1="20" y1="36" x2="880" y2="36" stroke="#ccc"/>
<text x="30" y="62" font-size="12" font-weight="700" text-anchor="start" fill="#000">먼저 역할을 정하고, 그 역할에 색을 하나씩 배정합니다</text>
<rect x="30" y="82" width="120" height="38" rx="4" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
<text x="165" y="98" font-size="12" font-weight="700" text-anchor="start" fill="#000">주조 60%</text>
<text x="165" y="114" font-size="10.5" font-weight="400" text-anchor="start" fill="#6b7280">#F9FAFB</text>
<text x="265" y="106" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">바탕과 카드 배경. 화면에서 가장 넓은 면적</text>
<rect x="30" y="134" width="120" height="38" rx="4" fill="#2b4c7e" stroke="none" stroke-width="1"/>
<text x="165" y="150" font-size="12" font-weight="700" text-anchor="start" fill="#000">보조 30%</text>
<text x="165" y="166" font-size="10.5" font-weight="400" text-anchor="start" fill="#6b7280">#2B4C7E</text>
<text x="265" y="158" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">헤더 · GNB · 기본 버튼. 브랜드가 드러나는 자리</text>
<rect x="30" y="186" width="120" height="38" rx="4" fill="#e8590c" stroke="none" stroke-width="1"/>
<text x="165" y="202" font-size="12" font-weight="700" text-anchor="start" fill="#000">강조 10%</text>
<text x="165" y="218" font-size="10.5" font-weight="400" text-anchor="start" fill="#6b7280">#E8590C</text>
<text x="265" y="210" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">가격과 구매 버튼에만. 다른 곳에 쓰지 않습니다</text>
<text x="30" y="258" font-size="11.5" font-weight="400" text-anchor="start" fill="#6b7280">한 화면에서 차지하는 면적을 이 비율에 맞춥니다</text>
<rect x="30" y="268" width="480" height="22" rx="0" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
<rect x="510" y="268" width="240" height="22" rx="0" fill="#2b4c7e" stroke="none" stroke-width="1"/>
<rect x="750" y="268" width="80" height="22" rx="0" fill="#e8590c" stroke="none" stroke-width="1"/>
<text x="270" y="283" font-size="10.5" font-weight="500" text-anchor="middle" fill="#6b7280">주조 60</text>
<text x="630" y="283" font-size="10.5" font-weight="500" text-anchor="middle" fill="#fff">보조 30</text>
<text x="790" y="283" font-size="10.5" font-weight="500" text-anchor="middle" fill="#fff">강조 10</text>
<line x1="20" y1="316" x2="880" y2="316" stroke="#ccc"/>
<text x="30" y="340" font-size="12" font-weight="700" text-anchor="start" fill="#000">자주 나오는 문제</text>
<text x="30" y="362" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">색을 여덟 개 늘어놓고 어디에 쓰는지는 적지 않은 경우입니다.</text>
<text x="30" y="382" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">색의 개수보다 역할이 정해졌는지가 중요합니다. 세 가지 역할과 중립색 몇 단계면 충분합니다.</text>
<text x="30" y="404" font-size="11.5" font-weight="400" text-anchor="start" fill="#6b7280">강조색을 정해 두지 않으면 화면마다 가격 색이 달라져 16번에서 감점됩니다.</text>
</svg>
