<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452">
<style>text{font-family:"Malgun Gothic",sans-serif;fill:#000}</style>
<defs><marker id="o" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#000"/></marker><marker id="ox" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#000"/></marker><marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7 z" fill="#000"/></marker></defs>
<rect width="900" height="452" fill="#fff"/>
<text x="20" y="28" font-size="14" font-weight="700" text-anchor="start" fill="#000">유스케이스 다이어그램에 쓰는 기호</text>
<line x1="20" y1="38" x2="880" y2="38" stroke="#ccc"/>
<text x="30" y="70" font-size="12" font-weight="700" text-anchor="start" fill="#000">① 요소</text>
<circle cx="80" cy="100" r="10" fill="#fff" stroke="#000"/><path d="M80 110 v26 M64 120 h32 M80 136 l-13 21 M80 136 l13 21" stroke="#000" fill="none"/>
<text x="80" y="172" font-size="11.5" font-weight="400" text-anchor="middle" fill="#000">액터 (사람)</text>
<rect x="150" y="88" width="104" height="42" fill="#fff" stroke="#000"/>
<text x="202" y="104" font-size="9.5" font-weight="400" text-anchor="middle" fill="#000">&#171;system&#187;</text>
<text x="202" y="120" font-size="11.5" font-weight="400" text-anchor="middle" fill="#000">외부 시스템</text>
<text x="202" y="172" font-size="11.5" font-weight="400" text-anchor="middle" fill="#000">액터 (시스템)</text>
<ellipse cx="350" cy="108" rx="62" ry="20" fill="#fff" stroke="#000"/>
<text x="350" y="112" font-size="11.5" font-weight="400" text-anchor="middle" fill="#000">유스케이스</text>
<text x="350" y="172" font-size="11.5" font-weight="400" text-anchor="middle" fill="#000">시스템이 하는 일</text>
<rect x="450" y="78" width="150" height="62" fill="none" stroke="#000"/>
<text x="460" y="96" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">시스템 이름</text>
<text x="525" y="172" font-size="11.5" font-weight="400" text-anchor="middle" fill="#000">시스템 경계</text>
<text x="640" y="100" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">액터는 경계 밖에,</text>
<text x="640" y="118" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">유스케이스는 안에 둡니다</text>
<text x="30" y="218" font-size="12" font-weight="700" text-anchor="start" fill="#000">② 관계선</text>
<text x="44" y="254" font-size="12" font-weight="700" text-anchor="start" fill="#000">연관</text>
<line x1="130" y1="250" x2="250" y2="250" stroke="#000"/>
<text x="270" y="254" font-size="11.5" font-weight="400" text-anchor="start" fill="#555">실선 · 화살촉 없음</text>
<text x="430" y="254" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">액터가 그 일을 한다</text>
<text x="44" y="302" font-size="12" font-weight="700" text-anchor="start" fill="#000">include</text>
<line x1="130" y1="298" x2="248" y2="298" stroke="#000" stroke-dasharray="5 3" marker-end="url(#o)"/>
<text x="270" y="302" font-size="11.5" font-weight="400" text-anchor="start" fill="#555">점선 · 속 빈 화살촉</text>
<text x="430" y="302" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">항상 거친다 (기반 → 포함)</text>
<text x="700" y="302" font-size="11.5" font-weight="400" text-anchor="start" fill="#555">«include» 라고 적습니다</text>
<text x="44" y="350" font-size="12" font-weight="700" text-anchor="start" fill="#000">extend</text>
<line x1="130" y1="346" x2="248" y2="346" stroke="#000" stroke-dasharray="5 3" marker-end="url(#o)"/>
<text x="270" y="350" font-size="11.5" font-weight="400" text-anchor="start" fill="#555">점선 · 속 빈 화살촉</text>
<text x="430" y="350" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">조건이 맞을 때만 (확장 → 기반)</text>
<text x="700" y="350" font-size="11.5" font-weight="400" text-anchor="start" fill="#555">«extend» 라고 적습니다</text>
<text x="44" y="398" font-size="12" font-weight="700" text-anchor="start" fill="#000">일반화</text>
<line x1="130" y1="394" x2="236" y2="394" stroke="#000"/>
<path d="M250 394 L236 387 L236 401 Z" fill="#fff" stroke="#000"/>
<text x="270" y="398" font-size="11.5" font-weight="400" text-anchor="start" fill="#555">실선 · 속 빈 삼각형</text>
<text x="430" y="398" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">상속한다 (자식 → 부모)</text>
<text x="130" y="438" font-size="11.5" font-weight="400" text-anchor="start" fill="#555">extend 는 조건을 [배송 전] 처럼 대괄호로 함께 적습니다.</text>
</svg>
